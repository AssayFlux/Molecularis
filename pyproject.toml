[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molecularis-workbench"
version = "0.1.0"
description = "Offline-first scientific research workbench"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
docking = [
  "vina==1.2.7",
]
md = [
  "openmm==8.6.1",
]
sequence = [
  "biopython>=1.83,<2",
  "biotite>=1.0,<2",
  "parasail>=1.3.4,<2",
]
genomics = [
  "pysam>=0.22,<1",
]
chemistry = [
  "rdkit>=2023.9",
]
dev = [
  "jsonschema[format]>=4.23,<5",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "PyYAML>=6,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
  "tomli>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
mypy_path = "python"
strict = true

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
