name: Alpha documentation integrity

on:
  push:
    branches: [Alpha]
  pull_request:
    branches: [CORE]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpha-docs:
    name: Validate Alpha documentation set
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate required Alpha documents
        run: python scripts/check_alpha_docs.py
