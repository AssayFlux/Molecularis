name: Molecularis Engine CI
on:
  push:
    branches: [CORE]
  pull_request:
    branches: [CORE]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: molecularis-engine-${{ github.ref }}
  cancel-in-progress: false
jobs:
  python-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Molecularis
        run: python -m pip install -e .
      - name: Validate capability registry
        run: python scripts/check_registry.py
      - name: Compile Python sources
        run: python -m compileall -q python scripts
      - name: Run tests
        run: pytest
