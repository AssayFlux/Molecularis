name: Molecularis validation and Android build
on:
  push:
    branches: [main, v0.1.1, CORE, Alpha]
  pull_request:
    branches: [main, v0.1.1, CORE]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: molecularis-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  python-foundations:
    name: Python foundation, registry and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt
      - name: Validate pre-commit configuration
        run: pre-commit validate-config
      - name: Install Molecularis research package
        run: python -m pip install -e .
      # The legacy tree has import-order and formatter debt (66 import fixes and
      # 75 formatting changes were previously applied only in the runner). Do not
      # rewrite the checkout before tests: re-enable I and format --check after a
      # dedicated formatting-only source commit.
      - name: Check Python lint without modifying source
        run: ruff check --ignore I scripts tests
      - name: Mypy production code
        run: mypy scripts python/molecularis
      - name: Registry validation
        run: python scripts/check_registry.py
      - name: Verify Track U completion audit is present
        run: test -s docs/track-u/completion-audit.md
      - name: Track G governance structure and capability claims
        run: |
          python scripts/check_governance.py
          python scripts/generate_governance_claims.py --check
      - name: Verify generated Android capability catalogue is reproducible
        run: python scripts/gen_android_capability_catalog.py --check
      - name: Verify generated design tokens are reproducible
        run: |
          python scripts/gen_design_tokens.py
          git diff --exit-code -- android/designsystem/src/main/java/org/assayflux/designsystem/GeneratedTokens.kt web/viewers/src/styles/molecularis-tokens.css
          python scripts/gen_component_catalogue.py
          git diff --exit-code -- docs/ui/component-catalogue.md
      - name: Android offline/build-first configuration guardrails
        run: python scripts/check_android_config.py
      - name: Verify Python and Android release versions stay aligned
        run: python scripts/check_version.py
      - name: Verify Android capability integration matrix counts and routes
        run: python scripts/check_android_capability_matrix.py
      - name: Validate public non-patient dataset catalogue
        run: python scripts/check_public_dataset_catalog.py
      - name: Validate metadata-only ADMET source catalogue
        run: python scripts/check_admet_source_catalog.py
      - name: Unit tests
        run: pytest
      - name: Reproduction stub
        run: scripts/reproduce-all
      - name: Check local Android build script syntax
        run: bash -n scripts/build_android_local.sh

  scientific-reference-validation:
    name: Pinned host-side scientific reference comparisons
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python validation host
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: validation/requirements-scipy.txt
      - name: Install pinned host-only numerical and sequence reference dependencies
        run: python -m pip install -r validation/requirements-scipy.txt -r validation/requirements-biopython.txt
      - name: Compare exploratory Michaelis-Menten fit with SciPy
        run: PYTHONPATH=python python validation/kinetics_scipy_reference.py > kinetics-scipy-reference-result.json
      - name: Compare oral PK closed form with independent SciPy ODE
        run: PYTHONPATH=python python validation/pkpd_scipy_reference.py > pkpd-scipy-reference-result.json
      - name: Compare explicit genetic-code tables with Biopython
        run: PYTHONPATH=python python validation/genetic_code_biopython_reference.py > genetic-code-reference-result.json
      - name: Compare PDB parsing, contacts and superposed RMSD with Biopython and NumPy
        run: PYTHONPATH=python python validation/structure_biopython_reference.py > structure-biopython-reference-result.json
      - name: Compare neighbour-joining tree distances with Biopython
        run: PYTHONPATH=python python validation/phylo_biopython_reference.py > phylo-biopython-reference-result.json
      - name: Compare NB2 differential expression with independent SciPy likelihood fit
        run: PYTHONPATH=python python validation/omics_nb2_scipy_reference.py > omics-nb2-reference-result.json
      - name: Assert scientific reference comparisons passed
        run: |
          python -c "import json; paths=['kinetics-scipy-reference-result.json','pkpd-scipy-reference-result.json','genetic-code-reference-result.json','structure-biopython-reference-result.json','phylo-biopython-reference-result.json','omics-nb2-reference-result.json']; results=[json.load(open(p, encoding='utf-8')) for p in paths]; failures=[r.get('validation_id', p) for p,r in zip(paths,results) if not r.get('overall_pass', False)]; assert not failures, f'Reference validation failed: {failures}'"
      - name: Upload synthetic numerical and codon-table comparison records
        uses: actions/upload-artifact@v4
        with:
          name: kinetics-host-reference-results-${{ github.sha }}
          path: |
            kinetics-scipy-reference-result.json
            pkpd-scipy-reference-result.json
            genetic-code-reference-result.json
            structure-biopython-reference-result.json
            phylo-biopython-reference-result.json
            omics-nb2-reference-result.json
          if-no-files-found: error
          retention-days: 90

  chemistry-reference-validation:
    name: Pinned host-side RDKit descriptor sanity fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python validation host
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: validation/requirements-rdkit.txt
      - name: Install pinned host-only RDKit
        run: python -m pip install -r validation/requirements-rdkit.txt
      - name: Run molecule descriptor sanity fixtures
        run: PYTHONPATH=python python validation/chemistry_reference.py > chemistry-reference-result.json
      - name: Upload chemistry reference record
        uses: actions/upload-artifact@v4
        with:
          name: molecularis-rdkit-reference-${{ github.sha }}
          path: chemistry-reference-result.json
          if-no-files-found: error
          retention-days: 90

  source-sbom-inventory:
    name: Generate declared source dependency SPDX inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SBOM generator dependency
        run: python -m pip install tomli==2.2.1
      - name: Generate direct-dependency SPDX inventory
        run: python scripts/generate_source_sbom.py --output source-dependencies.spdx.json
      - name: Upload direct-dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: molecularis-source-sbom-${{ github.sha }}
          path: source-dependencies.spdx.json
          if-no-files-found: error
          retention-days: 90

  android-arm64-build:
    name: Android arm64 debug APK/AAB build and package tests
    # Pin the runner image and host Python independently from the Chaquopy target runtime.
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up exact Python build host
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install pinned Android SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          yes | sdkmanager --licenses
      - name: Install host build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
      - name: Set up Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      # Persist pinned toolchains, dependencies, and the verified Biopython Android wheel.
      # The wheel is cached separately from ~/.cache because Gradle consumes it from the repo.
      - name: Restore Android cross-build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/molecularis
            android/app/libs/python-wheels
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
          key: android-arm64-${{ runner.os }}-${{ hashFiles('scripts/build_android_local.sh', 'android/native-rust/Cargo.lock', 'android/app/build.gradle.kts', 'android/biopython-wheel/meta.yaml') }}
          restore-keys: |
            android-arm64-${{ runner.os }}-
      - name: Record build environment
        run: |
          java -version
          python --version
          rustc --version
          cargo --version
          "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
      - name: Build arm64 APK/AAB and verify package alignment
        run: |
          set -o pipefail
          chmod +x scripts/build_android_local.sh
          scripts/build_android_local.sh 2>&1 | tee android-build.log
      - name: Run Android JVM unit-test task
        working-directory: android
        run: >-
          "$HOME/.cache/molecularis/gradle-8.13/gradle-8.13/bin/gradle" --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Capture resolved dependency graphs and artifact hashes
        working-directory: android
        run: |
          "$HOME/.cache/molecularis/gradle-8.13/gradle-8.13/bin/gradle" --no-daemon :app:dependencies --configuration debugRuntimeClasspath > ../gradle-debug-runtime-dependencies.txt
          "$HOME/.cache/molecularis/gradle-8.13/gradle-8.13/bin/gradle" --no-daemon :app:buildEnvironment > ../gradle-build-environment.txt
          cargo tree --locked --all-features --manifest-path native-rust/Cargo.toml > ../cargo-dependency-tree.txt
          cargo metadata --locked --format-version 1 --manifest-path native-rust/Cargo.toml > ../cargo-metadata.json
          sha256sum native-rust/Cargo.lock > ../cargo-lock-sha256.txt
          { find app/libs/python-wheels -type f -name '*.whl' -print0; find "$HOME/.cache/molecularis/chaquopy-17.2.0/server/pypi/dist/numpy" -type f -name '*.whl' -print0; } | sort -z | xargs -0 -r sha256sum > ../android-python-wheel-sha256.txt
          find "$HOME/.gradle/caches/modules-2/files-2.1" -type f \( -name '*.jar' -o -name '*.aar' -o -name '*.pom' -o -name '*.module' \) -print0 | sort -z | xargs -0 -r sha256sum > ../gradle-resolved-artifact-sha256.txt
      - name: Verify APK/AAB artifacts and record hashes
        run: python scripts/check_android_artifacts.py
      - name: Upload debug APK, AAB and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molecularis-android-arm64-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
            android-build.log
            gradle-debug-runtime-dependencies.txt
            gradle-build-environment.txt
            cargo-dependency-tree.txt
            cargo-metadata.json
            cargo-lock-sha256.txt
            android-python-wheel-sha256.txt
            gradle-resolved-artifact-sha256.txt
          if-no-files-found: warn
          retention-days: 14

  vina-engine-smoke:
    name: Pinned AutoDock Vina engine smoke check (not scientific validation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python validation host
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: validation/requirements-vina.txt
      - name: Install pinned Vina and schema validator
        run: python -m pip install -r validation/requirements-vina.txt
      - name: Run deterministic 1IEP Vina engine smoke check
        env:
          PYTHONPATH: python
        run: python validation/vina_engine_smoke.py > vina-engine-smoke-result.json
      - name: Upload engine smoke record
        uses: actions/upload-artifact@v4
        with:
          name: molecularis-vina-engine-smoke-${{ github.sha }}
          path: vina-engine-smoke-result.json
          if-no-files-found: error
          retention-days: 90

  openmm-engine-smoke:
    name: Pinned OpenMM CPU replica smoke check (not scientific validation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python validation host
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: validation/requirements-openmm.txt
      - name: Install pinned OpenMM and schema validator
        run: python -m pip install -r validation/requirements-openmm.txt
      - name: Run synthetic CPU replica smoke check
        env:
          PYTHONPATH: python
        run: python validation/openmm_engine_smoke.py > openmm-engine-smoke-result.json
      - name: Upload OpenMM engine smoke record
        uses: actions/upload-artifact@v4
        with:
          name: molecularis-openmm-engine-smoke-${{ github.sha }}
          path: openmm-engine-smoke-result.json
          if-no-files-found: error
          retention-days: 90

  private-node-worker-tests:
    name: Private Node docking worker security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check worker JavaScript syntax
        run: node --check remote-node/server.mjs
      - name: Run dependency-free worker security tests
        working-directory: remote-node
        run: npm test

  admet-validation-smoke:
    name: Pinned RDKit ADMET evaluation utilities smoke check (no model/data)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python validation host
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: validation/requirements-admet.txt
      - name: Install pinned RDKit and schema validator
        run: python -m pip install -r validation/requirements-admet.txt
      - name: Run scaffold split, metric and applicability smoke check
        env:
          PYTHONPATH: python
        run: python validation/admet_validation_smoke.py > admet-validation-smoke-result.json
      - name: Upload ADMET utility smoke record
        uses: actions/upload-artifact@v4
        with:
          name: molecularis-admet-validation-smoke-${{ github.sha }}
          path: admet-validation-smoke-result.json
          if-no-files-found: error
          retention-days: 90
