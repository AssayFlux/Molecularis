name: Android source checks

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-source-checks:
    name: Android tests, lint and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Android unit tests only
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Run Android lint
        run: ./gradlew --no-daemon :app:lintDebug --stacktrace
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: molecularis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
