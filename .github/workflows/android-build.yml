name: Android source checks

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-source-checks:
    name: Android unit tests and lint (no APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Android unit tests only
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Run Android lint only
        run: ./gradlew --no-daemon :app:lintDebug --stacktrace
