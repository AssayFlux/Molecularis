name: Bug report
description: Report a reproducible defect in Molecularis
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, API keys, private documents, personal data, or participant data. Report security vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behaviour and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ... 2. ... 3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs
      description: Remove tokens, file paths containing personal information, and document contents.
